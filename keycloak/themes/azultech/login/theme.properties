# Azul Tech — SSO login theme
#
# Extends the stock Keycloak login theme and only repaints the chrome:
# a deep navy / royal-blue background instead of the default light PatternFly grey.
# All layout, i18n and templates are inherited from `parent=keycloak`.

parent=keycloak
import=common/keycloak

# Keep the stock login.css, then append our override so it wins the cascade.
# PatternFly / pficon come from the inherited `stylesCommon` (parent=keycloak).
styles=css/login.css css/azultech.css

meta=viewport==width=device-width,initial-scale=1

kcHtmlClass=login-pf
kcLoginClass=login-pf-page
