# ============================================================
#  Azul Tech SSO — email copy (English)
#
#  Overrides the stock Keycloak email strings so that:
#   - every subject line is prefixed "Azul SSO:" and says plainly what
#     the email is for (Rene's review, image 1: people should see it is
#     Azul SSO in the notification)
#   - the onboarding email reads as "set up your single sign-on
#     credentials", not "your administrator wants you to update your
#     account" (image 2)
#   - the wording lines up with the branded HTML shell in html/*.ftl
#     (image 3)
#
#  Keys not listed here fall back to parent=keycloak / base.
#  Anything passed arguments by Keycloak uses java.text.MessageFormat:
#  keep literal apostrophes doubled ('') and {0} placeholders intact.
# ============================================================

# --- Subjects (inbox line / phone notification) -------------------------
emailVerificationSubject=Azul SSO: Confirm your email address
emailUpdateConfirmationSubject=Azul SSO: Confirm your new email address
identityProviderLinkSubject=Azul SSO: Link your {0} account
passwordResetSubject=Azul SSO: Reset your password
executeActionsSubject=Azul SSO: Set up your sign-in credentials
emailTestSubject=Azul SSO: SMTP test message

eventLoginErrorSubject=Azul SSO: New sign-in attempt on your account
eventUpdatePasswordSubject=Azul SSO: Your password was changed
eventUpdateTotpSubject=Azul SSO: Your authenticator app was changed
eventRemoveTotpSubject=Azul SSO: Your authenticator app was removed
eventUpdateCredentialSubject=Azul SSO: Your sign-in credentials were changed
eventRemoveCredentialSubject=Azul SSO: A sign-in credential was removed
eventUserDisabledByTemporaryLockoutSubject=Azul SSO: Your account is temporarily locked
eventUserDisabledByPermanentLockoutSubject=Azul SSO: Your account has been locked

# --- Shared chrome (used by html/template.ftl + text/template.ftl) ------
azulBrand=Azul SSO
azulFooterHelp=Need help? Contact your IT team at support@azultech.rw
azulFooterAutomated=This is an automated message from Azul Tech Single Sign-On. Please do not reply to it.
azulButtonFallback=If the button does not work, copy and paste this address into your browser:
azulExpiryLink=For your security, this link expires in {0}.
azulCodeExpiry=For your security, this code expires shortly. Never share it with anyone.

# --- Friendlier names for the onboarding checklist ---------------------
requiredAction.CONFIGURE_TOTP=set up your authenticator app
requiredAction.UPDATE_PASSWORD=choose a password
requiredAction.VERIFY_EMAIL=confirm your email address
requiredAction.CONFIGURE_RECOVERY_AUTHN_CODES=save your recovery codes

# --- Onboarding / set-up-your-account (executeActions) ----------------
executeActionsHeading=Set up your single sign-on account
executeActionsIntro=Your Azul Tech account is ready. Azul Tech Single Sign-On is the one login you use for all internal company applications. Set up your sign-in credentials now to start using it.
executeActionsList=You will be asked to: {0}.
executeActionsButton=Set up my account
executeActionsIgnore=If you were not expecting this email, you can ignore it. Nothing changes on your account until you use the link.
executeActionsBody=Your Azul Tech account is ready.\n\nAzul Tech Single Sign-On is the one login you use for all internal company applications. Set up your sign-in credentials now to start using it.\n\nYou will be asked to: {3}.\n\nSet up your account:\n{0}\n\nFor your security, this link expires in {4}.\n\nIf you were not expecting this email, you can ignore it. Nothing changes on your account until you use the link.

# --- Password reset --------------------------------------------------
passwordResetHeading=Reset your password
passwordResetIntro=We received a request to reset the password on your Azul Tech Single Sign-On account. Choose a new one using the button below.
passwordResetButton=Reset my password
passwordResetIgnore=If you did not ask to reset your password, you can ignore this email and it will stay the same.
passwordResetBody=We received a request to reset the password on your Azul Tech Single Sign-On account.\n\nChoose a new one here:\n{0}\n\nFor your security, this link expires in {3}.\n\nIf you did not ask to reset your password, you can ignore this email and it will stay the same.

# --- Email verification: link --------------------------------------
emailVerificationHeading=Confirm your email address
emailVerificationIntro=Confirm this email address to finish setting up your Azul Tech Single Sign-On account.
emailVerificationButton=Confirm my email address
emailVerificationIgnore=If you did not create an Azul Tech account, you can ignore this email.
emailVerificationBody=Confirm this email address to finish setting up your Azul Tech Single Sign-On account.\n\n{0}\n\nFor your security, this link expires in {3}.\n\nIf you did not create an Azul Tech account, you can ignore this email.

# --- Email verification: one-time code ----------------------------
emailVerificationCodeHeading=Your verification code
emailVerificationCodeIntro=Enter this code on the Azul Tech sign-in screen to confirm your email address.
emailVerificationBodyCode=Enter this code on the Azul Tech sign-in screen to confirm your email address:\n\n{0}\n\nFor your security, this code expires shortly. Never share it with anyone.
