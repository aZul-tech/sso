# Azul Tech — SSO email theme
#
# Wraps every Keycloak-sent email (onboarding, password reset, email
# verification, security notifications) in an Azul-branded HTML shell that
# matches the `azultech` login theme: deep-navy background, white card,
# royal-blue accents. Only the chrome + wording change — all the flow logic,
# tokens and links are inherited from `parent=keycloak`.
#
# Subjects and the reworded body copy live in messages/messages_en.properties.

parent=keycloak

locales=en,sw
